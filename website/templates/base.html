<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="/index.html">Oh My Learning</a>
      <nav class="nav" aria-label="Domains">
        <p class="nav-section">Domains</p>
        <ul>
          {% for d in domains %}
          <li>
            <a href="{{ d.url }}" class="{% if domain and d.slug == domain.slug %}active{% endif %}">
              {{ d.title }}
            </a>
          </li>
          {% endfor %}
        </ul>
      </nav>
      {% if domain %}
      <nav class="nav nav-sub" aria-label="Subjects in {{ domain.title }}">
        <p class="nav-section">{{ domain.title }}</p>
        <ul>
          {% for s in domain.subjects %}
          <li>
            <a href="{{ s.url }}" class="{% if subject and s.slug == subject.slug %}active{% endif %}">
              {{ s.title }}
            </a>
          </li>
          {% endfor %}
        </ul>
      </nav>
      {% endif %}
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
